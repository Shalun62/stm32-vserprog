name: Build STM32 vserprog for Blue Pill

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y make gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: make BOARD=stm32-bluepill
      - uses: actions/upload-artifact@v4
        with:
          name: stm32-vserprog-firmware
          path: |
            *.hex
            *.bin
